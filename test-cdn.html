<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiểm tra CDN</title>
<style>
  body{ font-family: -apple-system, sans-serif; background:#0c0d0f; color:#eee; padding:20px; line-height:1.6; }
  h1{ font-size:20px; }
  .box{ background:#161718; border:1px solid #333; border-radius:8px; padding:14px; margin:12px 0; white-space:pre-wrap; word-break:break-word; font-family: monospace; font-size:13px; }
  .ok{ border-color:#2ecc71; color:#2ecc71; }
  .err{ border-color:#e74c3c; color:#ff8080; }
  .pending{ border-color:#888; color:#ccc; }
</style>
</head>
<body>
<h1>🔍 Kiểm tra các CDN cho supabase-js</h1>
<div id="output"></div>

<script>
const out = document.getElementById('output');

function addBox(id, title){
  const div = document.createElement('div');
  div.className = 'box pending';
  div.id = id;
  div.textContent = title;
  out.appendChild(div);
  return div;
}

function setBox(div, title, content, isError){
  div.className = 'box ' + (isError ? 'err' : 'ok');
  div.textContent = title + (content ? ('\n' + content) : '');
}

const cdns = [
  { name: 'cdnjs', url: 'https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.4/supabase.min.js' },
  { name: 'jsDelivr', url: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js' },
  { name: 'unpkg', url: 'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js' }
];

cdns.forEach((cdn, i) => {
  const div = addBox('cdn-' + i, 'Đang thử tải từ ' + cdn.name + '...\n' + cdn.url);

  // Dùng fetch trước để biết chính xác là mạng chặn hay script lỗi
  fetch(cdn.url, { method: 'GET', mode: 'cors' })
    .then(res => {
      if(!res.ok){
        setBox(div, '❌ ' + cdn.name + ': HTTP ' + res.status, cdn.url, true);
        return;
      }
      return res.text().then(text => {
        const sizeKb = Math.round(text.length / 1024);
        setBox(div, '✅ ' + cdn.name + ': tải được (' + sizeKb + ' KB)', cdn.url, false);
      });
    })
    .catch(err => {
      setBox(div, '❌ ' + cdn.name + ': LỖI MẠNG', String(err && err.message ? err.message : err) + '\n' + cdn.url, true);
    });
});
</script>
</body>
</html>
