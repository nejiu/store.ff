<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiểm tra kết nối Supabase</title>
<style>
  body{ font-family: -apple-system, sans-serif; background:#0c0d0f; color:#eee; padding:20px; line-height:1.6; }
  h1{ font-size:20px; }
  .box{ background:#161718; border:1px solid #333; border-radius:8px; padding:14px; margin:12px 0; white-space:pre-wrap; word-break:break-word; font-family: monospace; font-size:13px; }
  .ok{ border-color:#2ecc71; color:#2ecc71; }
  .err{ border-color:#e74c3c; color:#ff8080; }
  .step{ color:#888; font-size:13px; margin-top:16px; }
</style>
</head>
<body>
<h1>🔍 Kiểm tra kết nối Supabase</h1>
<div id="output">Đang kiểm tra...</div>

<script>
const SUPABASE_URL = "https://zwlrwzrioufupkauixba.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kZaeKvOTP8eX-538u_rJMg_5EwWkAb9";

const out = document.getElementById('output');

function addBox(title, content, isError){
  const div = document.createElement('div');
  div.className = 'box ' + (isError ? 'err' : 'ok');
  div.textContent = title + '\n' + content;
  out.appendChild(div);
}

async function runTest(){
  out.innerHTML = '';

  // Bước 1: kiểm tra URL có phản hồi không (dùng REST endpoint trực tiếp, không qua thư viện)
  const url = SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/products?select=id,category,active&limit=5';

  try {
    const res = await fetch(url, {
      method: 'GET',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      }
    });

    const text = await res.text();

    addBox('HTTP Status: ' + res.status + ' ' + res.statusText, url, res.status >= 400);

    if(res.status >= 400){
      addBox('Nội dung lỗi trả về từ Supabase:', text, true);
    } else {
      addBox('✅ Kết nối thành công! Dữ liệu trả về:', text, false);
    }
  } catch (e) {
    addBox('❌ LỖI MẠNG / FETCH THẤT BẠI (không tới được server)', String(e && e.message ? e.message : e), true);
    addBox('Ghi chú', 'Lỗi này thường do: sai URL project, project đã bị pause/xoá, hoặc thiết bị không có mạng.', true);
  }

  // Bước 2: thử load thư viện supabase-js từ CDN xem có load được không
  addBox('Đang kiểm tra thư viện supabase-js từ CDN...', '', false);
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.4/supabase.min.js';
  script.onload = () => {
    if(window.supabase && typeof window.supabase.createClient === 'function'){
      addBox('✅ Thư viện supabase-js đã load thành công', 'window.supabase.createClient tồn tại', false);
    } else {
      addBox('⚠️ Script load xong nhưng không thấy window.supabase', 'Có thể phiên bản CDN có vấn đề', true);
    }
  };
  script.onerror = () => {
    addBox('❌ KHÔNG TẢI ĐƯỢC thư viện supabase-js từ CDN', 'https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.4/supabase.min.js không phản hồi hoặc bị chặn', true);
  };
  document.head.appendChild(script);
}

runTest();
</script>
</body>
</html>
